# Nombre usado por Spring y los registros del backend.
spring.application.name=pdfreader
# El límite de petición deja espacio para los encabezados del multipart, además del PDF de 20 MiB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Modelos OCR locales; una ruta vacía conserva la selección de directorio de Tesseract.
pdfreader.ocr.languages=spa+eng
pdfreader.ocr.tessdata=${TESSDATA_PREFIX:}
# Servicio semántico local configurable. HYBRID exige que responda con modelos disponibles.
pdfreader.docling.url=${DOCLING_URL:http://127.0.0.1:8090}
# LOCAL sigue siendo el valor inicial: cambiarlo a HYBRID requiere validar primero los modelos.
pdfreader.analysis.default=${ANALYSIS_ENGINE:LOCAL}
